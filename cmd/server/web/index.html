<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Семейные задачи</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Семейные задачи</h1>
      <span id="conn-badge" class="conn conn-online" title="Связь с сервером">
        <span class="conn-dot"></span>
        <span id="conn-text">онлайн</span>
      </span>
    </div>
    <div class="who">
      <button id="who-avatar" type="button" title="Сменить цвет">
        <span id="who-avatar-letter"></span>
      </button>
      <span id="who-name"></span>
      <button id="who-logout" type="button" hidden title="Сменить имя">×</button>
    </div>
  </header>

  <main>
    <!-- Семья: название, код приглашения, участники -->
    <section id="family-box" hidden>
      <div class="family-head">
        <span id="family-name"></span>
        <div class="family-code-block">
          <span class="chip muted">код: <b id="family-code"></b></span>
          <button id="family-regen" type="button" hidden title="Перевыпустить код">↻</button>
        </div>
      </div>
      <div id="family-members" class="task-meta"></div>
    </section>
    <!-- Нет семьи: создать / присоединиться -->
    <section id="family-gate" hidden>
      <div class="card">
        <h2>Создать семью</h2>
        <form id="family-create-form">
          <input id="family-name-input"
                 placeholder="Название (например, «Наши дела»)"
                 maxlength="80" required>
          <button type="submit">Создать</button>
        </form>
      </div>
      <div class="card">
        <h2>Присоединиться</h2>
        <form id="family-join-form">
          <input id="family-code-input"
                 placeholder="Код приглашения"
                 maxlength="16" required>
          <button type="submit">Войти</button>
        </form>
      </div>
    </section>

    <!-- Список задач -->
    <div id="tasks-area" hidden>
      <div class="toolbar">
        <div class="segmented" id="task-filter">
          <button type="button" data-filter="all" class="active">Все</button>
          <button type="button" data-filter="active">Активные</button>
        </div>
        <select id="task-sort">
          <option value="newest">Новые → старые</option>
          <option value="oldest">Старые → новые</option>
        </select>
      </div>

      <section id="tasks"></section>
      <p id="empty" hidden>Пока задач нет.</p>
    </div>
  </main>

  <!-- Плавающая кнопка добавления задачи -->
  <button id="add-task-fab" type="button" title="Добавить задачу" hidden>+</button>

  <!-- Модалка добавления задачи -->
  <div id="add-task-modal">
    <form id="add-form">
      <h2>Новая задача</h2>

      <input id="title"
             placeholder="Что сделать?"
             required maxlength="200">

      <select id="assignee" required></select>

      <label class="field">
        <span class="field-label">Срок (необязательно)</span>
        <input id="due" type="datetime-local">
      </label>

      <input id="description"
             placeholder="Детали (необязательно)"
             maxlength="500">

      <div class="modal-actions">
        <button type="button" id="add-task-cancel">Отмена</button>
        <button type="submit">Добавить</button>
      </div>
    </form>
  </div>

  <!-- Модалка имени -->
  <div id="name-modal">
    <form id="name-form">
      <h2>Как тебя зовут?</h2>
      <input id="name-input"
             placeholder="Имя"
             maxlength="60"
             autocomplete="name"
             required>
      <button type="submit">Продолжить</button>
    </form>
  </div>

  <!-- Палитра цветов -->
  <div id="color-picker" hidden>
    <div id="color-grid"></div>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
