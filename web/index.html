<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Семейные задачи</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <div class="brand">
      <h1>Семейные задачи</h1>
      <span id="conn-badge" class="conn conn-online" title="Связь с сервером">
        <span class="conn-dot"></span>
        <span id="conn-text">онлайн</span>
      </span>
    </div>
    <div class="who">
      <button id="family-open" type="button" title="Управление семьёй" hidden>
        <span class="family-open-icon">👥</span>
      </button>
      <button id="who-avatar" type="button" title="Сменить цвет" hidden>
        <span id="who-avatar-letter"></span>
      </button>
      <span id="who-name"></span>
      <button id="who-logout" type="button" hidden title="Выйти">×</button>
    </div>
  </header>

  <main>
    <section id="family-gate" hidden>
      <div class="card">
        <h2>Создать семью</h2>
        <form id="family-create-form">
          <input id="family-name-input" placeholder="Название (например, «Наши дела»)" maxlength="80" required>
          <button type="submit">Создать</button>
        </form>
      </div>
      <div class="card">
        <h2>Присоединиться по инвайту</h2>
        <p class="muted small">
          Примите ссылку-приглашение от владельца семьи
          или введите код вручную.
        </p>
        <form id="family-join-form">
          <input id="family-code-input" placeholder="Код инвайта" maxlength="64" required>
          <button type="submit">Войти</button>
        </form>
      </div>
    </section>

    <div id="tasks-area" hidden>
      <div class="toolbar">
        <div class="segmented" id="task-filter">
          <button type="button" data-quick="all">Все</button>
          <button type="button" data-quick="my-active">Мои</button>
          <button type="button" data-quick="overdue">Просроченные</button>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="filter-toggle" title="Подробный фильтр">⚙</button>
          <select id="task-sort">
            <option value="newest">Новые → старые</option>
            <option value="oldest">Старые → новые</option>
          </select>
        </div>
      </div>

      <div id="filter-panel" hidden>
        <div class="filter-grid">
          <label>
            <span>Статус</span>
            <select id="filter-status">
              <option value="all">Все</option>
              <option value="active">Активные (не готово)</option>
              <option value="todo">Надо</option>
              <option value="in_progress">В работе</option>
              <option value="done">Готово</option>
            </select>
          </label>
          <label>
            <span>Автор</span>
            <select id="filter-creator">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>Исполнитель</span>
            <select id="filter-assignee">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>Создана с</span>
            <input id="filter-created-from" type="date">
          </label>
          <label>
            <span>по</span>
            <input id="filter-created-to" type="date">
          </label>
          <button type="button" id="filter-reset" class="filter-reset">Сбросить подробный фильтр</button>
        </div>
      </div>

      <section id="tasks"></section>
      <p id="empty" hidden>Пока задач нет.</p>
    </div>
  </main>

  <button id="add-task-fab" type="button" title="Добавить задачу" hidden>+</button>

  <!-- Модалка добавления задачи -->
  <div id="add-task-modal">
    <form id="add-form">
      <h2>Новая задача</h2>
      <input id="title" placeholder="Что сделать?" required maxlength="200">
      <select id="assignee" required></select>
      <label class="field">
        <span class="field-label">Срок (необязательно)</span>
        <input id="due" type="datetime-local">
      </label>
      <input id="description" placeholder="Детали (необязательно)" maxlength="500">
      <div class="modal-actions">
        <button type="button" id="add-task-cancel">Отмена</button>
        <button type="submit">Добавить</button>
      </div>
    </form>
  </div>

  <!-- Модалка входа / регистрации -->
  <div id="auth-modal">
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" id="auth-tab-login" class="active">Вход</button>
        <button type="button" id="auth-tab-register">Регистрация</button>
      </div>

      <form id="auth-login-form">
        <input id="login-email" type="email" placeholder="Email" required autocomplete="email">
        <input id="login-password" type="password" placeholder="Пароль" required autocomplete="current-password">
        <button type="submit">Войти</button>
      </form>

      <form id="auth-register-form" hidden>
        <input id="register-email" type="email" placeholder="Email" required autocomplete="email">
        <input id="register-name" placeholder="Имя" required maxlength="60" autocomplete="name">
        <input id="register-password" type="password" placeholder="Пароль (минимум 8 символов)" required minlength="8"
          autocomplete="new-password">
        <label class="field">
          <span class="field-label">Инвайт (если пришли в семью)</span>
          <input id="register-invite" placeholder="Код инвайта" maxlength="64">
        </label>
        <p id="invite-hint" class="muted small" hidden></p>
        <button type="submit">Создать аккаунт</button>
      </form>
    </div>
  </div>

  <!-- Модалка управления семьёй -->
  <div id="family-modal">
    <div class="family-modal-card">
      <div class="family-modal-head">
        <h2 id="family-modal-title"></h2>
        <button type="button" id="family-modal-close" title="Закрыть">×</button>
      </div>

      <div class="family-modal-code">
        <span class="label">Код приглашения</span>
        <b id="family-modal-code"></b>
        <button type="button" id="family-modal-regen" title="Перевыпустить код" hidden>↻</button>
      </div>

      <div class="family-modal-members-label">Участники</div>
      <div id="family-modal-members" class="task-meta"></div>

      <!-- Инвайты (только для owner) -->
      <div id="invites-section" hidden>
        <div class="family-modal-members-label">
          <span>Приглашения</span>
          <button type="button" id="invite-create" title="Создать новую ссылку">+ Создать</button>
        </div>
        <div id="invites-list" class="invites-list"></div>
      </div>

      <div class="modal-actions">
        <button type="button" id="family-modal-close-btn">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Палитра цветов -->
  <div id="color-picker" hidden>
    <div id="color-grid"></div>
  </div>

  <!-- Скрытый input для загрузки вложений -->
  <input type="file" id="upload-input" accept="image/*" multiple hidden>

  <!-- Лайтбокс -->
  <div id="lightbox" hidden>
    <img id="lightbox-img" alt="">
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/main.js"></script>
</body>

</html>
