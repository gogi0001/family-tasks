<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Семейные задачи</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header>
    <div class="brand">
      <h1>Семейные задачи</h1>
      <span id="conn-badge" class="conn conn-online" title="Связь с сервером">
        <span class="conn-dot"></span>
        <span id="conn-text">онлайн</span>
      </span>
    </div>
    <div class="who">
      <button id="family-open" type="button" title="Управление семьёй" hidden>
        <span class="family-open-icon">👥</span>
      </button>
      <button id="who-avatar" type="button" title="Сменить цвет">
        <span id="who-avatar-letter"></span>
      </button>
      <span id="who-name"></span>
      <button id="who-logout" type="button" hidden title="Сменить имя">×</button>
    </div>
  </header>

  <main>
    <section id="family-gate" hidden>
      <div class="card">
        <h2>Создать семью</h2>
        <form id="family-create-form">
          <input id="family-name-input" placeholder="Название (например, «Наши дела»)" maxlength="80" required>
          <button type="submit">Создать</button>
        </form>
      </div>
      <div class="card">
        <h2>Присоединиться</h2>
        <form id="family-join-form">
          <input id="family-code-input" placeholder="Код приглашения" maxlength="16" required>
          <button type="submit">Войти</button>
        </form>
      </div>
    </section>

    <div id="tasks-area" hidden>
      <div class="toolbar">
        <div class="segmented" id="task-filter">
          <button type="button" data-quick="all">Все</button>
          <button type="button" data-quick="my-active">Мои</button>
          <button type="button" data-quick="overdue">Просроченные</button>
        </div>
        <div class="toolbar-actions">
          <button type="button" id="filter-toggle" title="Подробный фильтр">⚙</button>
          <select id="task-sort">
            <option value="newest">Новые → старые</option>
            <option value="oldest">Старые → новые</option>
          </select>
        </div>
      </div>

      <div id="filter-panel" hidden>
        <div class="filter-grid">
          <label>
            <span>Статус</span>
            <select id="filter-status">
              <option value="all">Все</option>
              <option value="active">Активные (не готово)</option>
              <option value="todo">Надо</option>
              <option value="in_progress">В работе</option>
              <option value="done">Готово</option>
            </select>
          </label>
          <label>
            <span>Автор</span>
            <select id="filter-creator">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>Исполнитель</span>
            <select id="filter-assignee">
              <option value="">Любой</option>
            </select>
          </label>
          <label>
            <span>Создана с</span>
            <input id="filter-created-from" type="date">
          </label>
          <label>
            <span>по</span>
            <input id="filter-created-to" type="date">
          </label>
          <button type="button" id="filter-reset" class="filter-reset">Сбросить подробный фильтр</button>
        </div>
      </div>

      <section id="tasks"></section>
      <p id="empty" hidden>Пока задач нет.</p>
    </div>
  </main>

  <button id="add-task-fab" type="button" title="Добавить задачу" hidden>+</button>

  <div id="add-task-modal">
    <form id="add-form">
      <h2>Новая задача</h2>
      <input id="title" placeholder="Что сделать?" required maxlength="200">
      <select id="assignee" required></select>
      <label class="field">
        <span class="field-label">Срок (необязательно)</span>
        <input id="due" type="datetime-local">
      </label>
      <input id="description" placeholder="Детали (необязательно)" maxlength="500">
      <div class="modal-actions">
        <button type="button" id="add-task-cancel">Отмена</button>
        <button type="submit">Добавить</button>
      </div>
    </form>
  </div>

  <div id="name-modal">
    <form id="name-form">
      <h2>Как тебя зовут?</h2>
      <input id="name-input" placeholder="Имя" maxlength="60" autocomplete="name" required>
      <button type="submit">Продолжить</button>
    </form>
  </div>

  <!-- Модалка управления семьёй -->
  <div id="family-modal">
    <div class="family-modal-card">
      <div class="family-modal-head">
        <h2 id="family-modal-title"></h2>
        <button type="button" id="family-modal-close" title="Закрыть">×</button>
      </div>

      <div class="family-modal-code">
        <span class="label">Код приглашения</span>
        <b id="family-modal-code"></b>
        <button type="button" id="family-modal-regen" title="Перевыпустить код" hidden>↻</button>
      </div>

      <div class="family-modal-members-label">Участники</div>
      <div id="family-modal-members" class="task-meta"></div>

      <div class="modal-actions">
        <button type="button" id="family-modal-close-btn">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="color-picker" hidden>
    <div id="color-grid"></div>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/main.js"></script>
</body>

</html>
